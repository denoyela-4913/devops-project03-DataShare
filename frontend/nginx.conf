server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads jusqu'à 1 Go (US01).
  client_max_body_size 1024m;

  # Compression des ressources texte (JS/CSS/JSON/SVG ; text/html l'est d'office).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/manifest+json image/svg+xml;

  # Proxy vers le backend.
  location ^~ /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  # robots.txt servi directement par nginx (sans fichier physique) : évite le
  # fallback SPA qui renverrait index.html.
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
  }

  # JS/CSS du build : noms hashés (outputHashing: all), donc cache longue durée sûr.
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Point d'entrée : toujours revalidé pour prendre les nouveaux noms de fichiers hashés.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
