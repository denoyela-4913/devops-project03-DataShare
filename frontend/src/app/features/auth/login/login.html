<!-- @figma-owned — style/structure visuelle maintenus depuis Figma via Cursor.
     À PRÉSERVER : les data-testid, [formGroup]/formControlName, (ngSubmit), les
     libellés for/id, aria-labelledby, aria-describedby, [invalid], <app-field-error>,
     [disabled], routerLink vers /register. Champs et bouton consomment les
     composants partagés `app-ui-input` / `app-ui-button` (shared/components).
     Frame: DataShare_local · Desktop - 6 (55:400) Connexion · iPhone 16 - 9 (55:343)
     · voir design/figma-map.md -->
<section class="card" aria-labelledby="login-title" data-testid="login-view">
  <h1 class="card__title" id="login-title">Connexion</h1>

  <form class="form" data-testid="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form__fields">
      <app-ui-input
        label="Email"
        inputId="login-email"
        [invalid]="form.controls.email.invalid && form.controls.email.touched"
      >
        <input
          class="ui-field__control"
          id="login-email"
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="Saisissez votre email..."
          aria-describedby="login-email-error"
          data-testid="login-email-input"
        />
        <app-field-error
          [control]="form.controls.email"
          id="login-email-error"
          data-testid="login-email-error"
        />
      </app-ui-input>

      <app-ui-input
        label="Mot de passe"
        inputId="login-password"
        [invalid]="form.controls.password.invalid && form.controls.password.touched"
      >
        <input
          class="ui-field__control"
          id="login-password"
          formControlName="password"
          type="password"
          autocomplete="current-password"
          placeholder="Saisissez votre mot de passe..."
          aria-describedby="login-password-error"
          data-testid="login-password-input"
        />
        <app-field-error
          [control]="form.controls.password"
          id="login-password-error"
          data-testid="login-password-error"
        />
      </app-ui-input>
    </div>

    <div class="form__actions">
      <a class="btn btn--tertiary" routerLink="/register" data-testid="login-goto-register"
        >Créer un compte</a
      >
      <app-ui-button type="submit" [disabled]="submitting()" data-testid="login-submit">
        Connexion
      </app-ui-button>
    </div>
  </form>
</section>
