<!-- @figma-owned — carte d'un fichier dans l'historique (US05/US06).
     « Accéder » ouvre la page de téléchargement (route publique /d/:token) dans un
     nouvel onglet — un vrai <a href target="_blank">, à préserver comme lien.
     À PRÉSERVER : data-testid, le <a> « Accéder » (href + target), l'<app-ui-button>
     Supprimer + (pressed), les pipes fileSize et expiryStatus.
     Frames: DataShare_local · Mon espace 32:516 · Desktop - 4 (15:390) · iPhone 16 - 5 (27:338)
     · voir design/figma-map.md -->
@let expired = (file().expiresAt | expiryStatus) === 'expired';
<article class="file-card" [class.file-card--expired]="expired" data-testid="file-card">
  <img class="file-card__icon" src="assets/icons/icon-file.svg" width="24" height="24" alt="" />

  <div class="file-card__info">
    <span class="file-card__name" data-testid="file-card-name" [title]="file().name">
      {{ file().name }}
    </span>
    <span class="file-card__meta">
      <span class="file-card__size" data-testid="file-card-size">{{
        file().sizeBytes | fileSize
      }}</span>
      <span
        class="file-card__status"
        [class.file-card__status--expired]="expired"
        data-testid="file-card-status"
      >
        {{ expired ? 'Expiré' : 'Actif' }}
      </span>
    </span>
    @if (expired) {
      <p class="file-card__expired-copy">Ce fichier a expiré, il n'est plus stocké chez nous</p>
    }
  </div>

  @if (file().passwordProtected) {
    <img
      class="file-card__lock"
      src="assets/icons/icon-lock.svg"
      width="16"
      height="16"
      alt="Protégé"
      data-testid="file-card-locked"
    />
  }

  @if (!expired) {
    <div class="file-card__actions">
      <app-ui-button
        variant="secondary"
        size="small"
        (pressed)="remove.emit()"
        data-testid="file-card-delete"
      >
        <img src="assets/icons/icon-trash.svg" width="16" height="16" alt="" />
        Supprimer
      </app-ui-button>
      <a
        class="file-card__open"
        [href]="file().downloadUrl"
        target="_blank"
        rel="noopener noreferrer"
        data-testid="file-card-open"
      >
        Accéder
        <img src="assets/icons/icon-arrow-right.svg" width="16" height="16" alt="" />
      </a>
    </div>
  }
</article>
