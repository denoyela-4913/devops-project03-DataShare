version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      prefix-development: chore

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      prefix-development: chore
    groups:
      # Les paquets @angular/* exigent tous la même version (peer deps strictes) :
      # montés un par un, chaque PR échoue sur ERESOLVE (#22, #26, #34, #36).
      angular:
        patterns:
          - "@angular/*"
      # @vitest/coverage-v8 exige une version exacte de vitest (peer) : toujours ensemble.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # @angular/build (peerOptional vitest ^4.0.8) ne supporte pas vitest 5 : rester en 4.x
      # jusqu'à ce qu'@angular/build élargisse sa peer, puis retirer cette règle.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # Java 24 n'est pas une LTS (fin de support proche) : rester en 21 (LTS) jusqu'à
      # la prochaine LTS (25), puis retirer ces règles.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # Node 26 n'est pas une LTS : rester sur une version paire LTS (24).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
