version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      prefix-development: chore

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      prefix-development: chore
    groups:
      # Les paquets @angular/* exigent tous la même version (peer deps strictes) :
      # montés un par un, chaque PR échoue sur ERESOLVE (#22, #26, #34, #36).
      angular:
        patterns:
          - "@angular/*"
      # @vitest/coverage-v8 exige une version exacte de vitest (peer) : toujours ensemble.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
