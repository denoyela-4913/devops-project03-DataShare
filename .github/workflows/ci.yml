name: CI

# Backend + frontend wired. See docs/CI.md.
#
# Job map:
#   lint-front  lint-back  lint-repo  commitlint
#   backend-unit  backend-integ  frontend-unit  frontend-integ
#   frontend-e2e  assert-prod-bundle  security

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  # ---------- lint ----------
  lint-front:
    name: lint-front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Stylelint
        working-directory: frontend
        run: npm run lint:style
      - name: Prettier
        working-directory: frontend
        run: npm run format:check

  lint-back:
    name: lint-back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Spotless + Checkstyle + PMD
        working-directory: backend
        run: ./mvnw -B -ntp spotless:check checkstyle:check pmd:check

  lint-repo:
    name: lint-repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: yamllint
        run: pipx run yamllint -c .yamllint.yaml .
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
      - name: figma-owned headers
        run: bash tools/check-figma-owned.sh

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- backend tests ----------
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit tests (Surefire)
        working-directory: backend
        run: ./mvnw -B -ntp test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  backend-integ:
    name: backend-integ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Integration tests + coverage gate (Failsafe + Testcontainers + JaCoCo 70%)
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/
          if-no-files-found: ignore

  # ---------- frontend tests ----------
  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Config guard (prod is not debug)
        working-directory: frontend
        run: npm run verify:config
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm run test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  frontend-integ:
    name: frontend-integ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Integration tests (Vitest + TestBed)
        working-directory: frontend
        run: npm run test:integ

  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "placeholder: Cypress against a built stack, wired with the auth feature (US03/US04)"'

  assert-prod-bundle:
    name: assert-prod-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Config guard
        working-directory: frontend
        run: npm run verify:config
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Debug config must not leak into dist
        working-directory: frontend
        run: |
          if grep -rlE 'debugErrors:( *true|!0)' dist/; then
            echo "::error::debug flag found in production bundle"; exit 1
          fi
          if grep -rl 'styleguide' dist/; then
            echo "::error::styleguide route leaked into production bundle"; exit 1
          fi
          echo "OK - production bundle is clean"

  # ---------- security ----------
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
