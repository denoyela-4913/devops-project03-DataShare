# Profil des tests d'intégration. La datasource est fournie par Testcontainers
# (@ServiceConnection) — rien à configurer ici.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

datashare:
  error:
    verbose: false
  jwt:
    secret: test-only-jwt-secret-0123456789-0123456789
    issuer: datashare
    access-ttl: 1h
