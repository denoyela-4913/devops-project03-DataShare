# Profil dev : mode debug — le détail technique des erreurs est exposé (champ "debug"),
# Swagger est actif, l'actuator est plus large.
datashare:
  error:
    verbose: true

spring:
  jpa:
    show-sql: true

server:
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,mappings
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
