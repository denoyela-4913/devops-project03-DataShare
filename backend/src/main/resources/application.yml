spring:
  application:
    name: DataShare
  datasource:
    url: ${DATASHARE_DB_URL:jdbc:postgresql://localhost:5432/datashare}
    username: ${DATASHARE_DB_USERNAME:datashare}
    password: ${DATASHARE_DB_PASSWORD:datashare}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 2MB

# Défauts durcis : mode non verbeux, aucune fuite technique. Surchargés en dev.
datashare:
  error:
    verbose: false
  jwt:
    # Clé HMAC HS256 — >= 32 octets. Fournie par l'environnement en prod (aucun défaut ici).
    secret: ${DATASHARE_JWT_SECRET:}
    issuer: datashare
    access-ttl: 1h
  storage:
    endpoint: ${DATASHARE_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${DATASHARE_STORAGE_BUCKET:datashare-files}
    access-key: ${DATASHARE_STORAGE_ACCESS_KEY:datashare}
    secret-key: ${DATASHARE_STORAGE_SECRET_KEY:datashare-secret}
  files:
    max-size-bytes: 1073741824
    default-expiration-days: 7
    max-expiration-days: 7
    blocked-extensions: exe,bat,cmd,com,scr,msi,sh,ps1,vbs,vbe,js,jse,jar,dll,app,deb,rpm
    base-download-url: ${DATASHARE_DOWNLOAD_BASE_URL:http://localhost:8080/d}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
