# Dépendances de dev pour DataShare : PostgreSQL + MinIO (stockage compatible S3).
# Le backend et le frontend se lancent hors compose à ce stade.
#   Démarrer : docker compose --env-file .env up -d   (copier .env.example -> .env d'abord)
#   Arrêter  : docker compose down          (ajouter -v pour effacer les volumes)

name: datashare-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datashare}
      POSTGRES_USER: ${POSTGRES_USER:-datashare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datashare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datashare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio a été retiré de Docker Hub en 10/2025 (MinIO Community est passé
    # source-only), quay.io/minio est passé privé (401) en 09/2026, et pgsty/minio est gelé
    # (renommé pgsty/silo le 06/08/2026). Image construite depuis notre fork
    # denoyela-4913/silo (copie de pgsty/silo) et publiée sur GHCR ; tag explicite (pas de
    # "latest"). L'entrypoint accepte encore `server` ; MINIO_ROOT_* restent supportées.
    image: ghcr.io/denoyela-4913/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datashare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-datashare-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mcli", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    # mcli est embarqué dans l'image serveur : plus d'image pgsty/mc séparée.
    image: ghcr.io/denoyela-4913/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://minio:9000 ${MINIO_ROOT_USER:-datashare} ${MINIO_ROOT_PASSWORD:-datashare-secret} &&
      mcli mb --ignore-existing local/${DATASHARE_STORAGE_BUCKET:-datashare-files} &&
      echo 'bucket ready';
      "

  adminer:
    image: adminer:latest
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  db-data:
  minio-data:
